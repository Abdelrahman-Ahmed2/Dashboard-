<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="/animate.css">
    <script src="wow.min.js"></script>
    <script>
        new WOW().init();
    </script>
</head>
</head>
<body>
    <div class="menu">
        <ul>
            <li class="profile">
                <div class="img-profile">
                    <img src="images/imguser.jpg" alt="profile">
                </div>
                <h2>Abdelrahman</h2>
            </li>

            <li class="active wow bounceIn" data-wow-duration="2s">
                <a href="#">
                <i class="fa-solid fa-house"></i>
                <p>dashboard</p>
                </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="3s">
                <a href="#">
            <i class="fas fa-user-group"></i>
            <p>clients</p>
                </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="4s">
                <a href="#">
            <i class="fas fa-table"></i>
            <p>prducts</p>
            </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="5s">
                <a href="#">
            <i class="fas fa-chart-pie"></i>
            <p>charts</p>
                </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="6s">
                <a href="#">
            <i class="fas fa-pen"></i>
            <p>posts</p>
                </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="7s">
                <a href="#">
            <i class="fas fa-star"></i>
            <p>favorite</p>
            </a>
            </li>

            <li class="wow bounceIn" data-wow-duration="8s">
                <a href="#">
            <i class="fas fa-cog"></i>
            <p>settings</p>
            </a>
            </li>

            <li class="log-out">
                <a href="#">
            <i class="fas fa-sign-out"></i>
            <p>Log Out</p>
            </a>
            </li>
        </ul>
    </div>

    <div class="content">
        <div class="titel-info">
            <p>Dashboard</p>
            <i class="fas fa-chart-bar"></i>
        </div>

        <div class="data-info">
            <div class="box wow bounceIn" data-wow-duration="1s">
                <i class="fas fa-user"></i>
                <div class="data">
                    <p>user</p>
                    <span>100</span>
                </div>
            </div>

            <div class="box wow bounceIn" data-wow-duration="2s">
                <i class="fas fa-pen"></i>
                <div class="data">
                    <p>post</p>
                    <span>950</span>
                </div>
            </div>

            <div class="box wow bounceIn" data-wow-duration="3s">
                <i class="fas fa-table"></i>
                <div class="data">
                    <p>products</p>
                    <span>30</span>
                </div>
            </div>

            <div class="box wow bounceIn" data-wow-duration="4s">
                <i class="fas fa-dollar"></i>
                <div class="data">
                    <p>revenue</p>
                    <span>$200</span>
                </div>
            </div>
        </div>

            <div class="titel-info">
            <p>products</p>
            <i class="fas fa-table"></i>
        </div>

        <table>
            <thead>
                <tr>
                    <th>products</th>
                    <th>price</th>
                    <th>count</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="wow bounceIn" data-wow-duration="1s">mobile phone</td>
                    <td><span class="price wow bounceIn" data-wow-duration="1s">$10000</span></td>
                    <td><span class="count wow bounceIn" data-wow-duration="1s">1500</span></td>
                </tr>
                <tr>
                    <td class="wow bounceIn" data-wow-duration="2s">laotop</td>
                    <td><span class="price wow bounceIn" data-wow-duration="2s">$14500</span></td>
                    <td><span class="count wow bounceIn" data-wow-duration="2s">1700</span></td>
                </tr>
                <tr>
                    <td class="wow bounceIn" data-wow-duration="3s">tablet</td>
                    <td><span class="price wow bounceIn" data-wow-duration="3s">$12500</span></td>
                    <td><span class="count wow bounceIn" data-wow-duration="3s">980</span></td>
                </tr>
                <tr>
                    <td class="wow bounceIn" data-wow-duration="4s">smart Tv</td>
                    <td><span class="price wow bounceIn" data-wow-duration="4s">$20000</span></td>
                    <td><span class="count wow bounceIn" data-wow-duration="4s">500</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
